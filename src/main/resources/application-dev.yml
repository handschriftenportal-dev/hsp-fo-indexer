---
eureka:
  client:
    availabilityZones:
      potsdamerplatz: one
    enabled: true
    fetchRegistry: true
    healthcheck:
      enabled: false
    preferSameZoneEureka: true
    region: potsdamerplatz
    registerWithEureka: true
    serviceUrl:
      one: http://b-dev-registry.pk.de:8761/serviceregistry/eureka/

kafka:
  groupid: hsp-fo-indexer-dev
  resetOffset: false

logging:
  config: classpath:logback-dev.xml

solr:
  # used for disable polling in case a schema update is necessary
  # follower: http://localhost:8984

  # used for writing data
  leader: http://localhost:8983
  # whether to trigger re-indexing after schema update or not
  trigger-reindexing:
    false
  version: 9
